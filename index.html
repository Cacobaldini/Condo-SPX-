<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Condo SPX</title>
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#101B18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Condo SPX">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    --bg:#101B18;
    --paper:#F1F3EC;
    --paper2:#E7EAE0;
    --ink:#14201C;
    --ink-soft:#4A554E;
    --line:#D7D9CC;
    --accent:#D9A441;
    --accent-ink:#3A2C08;
    --green:#3F7D5C;
    --red:#B4483A;
    --blue:#3C6E8F;
    --purple:#7A5C9E;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#161F1B;
      --paper2:#1D2723;
      --ink:#EDEFE8;
      --ink-soft:#A9B3AB;
      --line:#33403A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#161F1B;
    --paper2:#1D2723;
    --ink:#EDEFE8;
    --ink-soft:#A9B3AB;
    --line:#33403A;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.nav-title{font-family:"Space Grotesk",-apple-system,sans-serif;}
  .logo{font-family:"Space Grotesk",-apple-system,sans-serif;font-weight:700;letter-spacing:-.02em;}
  .logo .accent{color:var(--accent);}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* topbar */
  .topbar{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:10;
    background:var(--bg);color:#F1F3EC;
    padding:16px 18px;display:flex;align-items:center;gap:12px;
  }
  .topbar .back{
    background:none;border:none;color:#F1F3EC;font-size:22px;line-height:1;
    padding:4px 6px;margin:-4px -6px -4px -8px;cursor:pointer;border-radius:6px;
  }
  .topbar .back:active{background:rgba(255,255,255,.12);}
  .brand{font-size:19px;font-weight:700;letter-spacing:.2px;}
  .brand small{display:block;font-family:-apple-system,sans-serif;font-weight:400;font-size:12px;color:#C7CDBE;margin-top:1px;}
  .nav-title{font-size:18px;font-weight:600;flex:1;}
  .logout{background:none;border:1px solid rgba(241,243,236,.35);color:#F1F3EC;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}

  main{flex:1;padding:18px;padding-bottom:96px;}

  /* auth screen */
  .auth-wrap{padding-top:10vh;max-width:380px;margin:0 auto;}
  .auth-hero{margin-bottom:28px;}
  .auth-hero h1{font-size:26px;margin:0 0 6px;}
  .auth-hero p{margin:0;color:var(--ink-soft);font-size:14.5px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select{
    width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;background:var(--paper2);color:var(--ink);font-family:inherit;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:13px 16px;border-radius:10px;border:none;
    font-size:15.5px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:active{filter:brightness(.95);}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .switch-mode{text-align:center;margin-top:16px;font-size:14px;color:var(--ink-soft);}
  .switch-mode button{background:none;border:none;color:var(--blue);font-weight:600;font-size:14px;cursor:pointer;padding:0;}
  .error-msg{background:rgba(180,72,58,.12);color:var(--red);border:1px solid rgba(180,72,58,.3);padding:10px 12px;border-radius:9px;font-size:13.5px;margin-bottom:14px;}

  /* city picker */
  .city-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .city-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:15px 16px;background:var(--paper2);border:1.5px solid var(--line);border-radius:11px;
    cursor:pointer;font-size:16px;font-weight:600;
  }
  .city-item .count{font-size:13px;font-weight:400;color:var(--ink-soft);}
  .add-city{display:flex;gap:8px;margin-top:6px;}
  .add-city input{flex:1;}
  .add-city button{flex-shrink:0;width:auto;padding:12px 16px;}
  .empty-hint{color:var(--ink-soft);font-size:14px;text-align:center;padding:30px 10px;}

  /* condo list */
  .search-bar{margin-bottom:16px;}
  .carousel-counter{text-align:center;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:10px;}
  .carousel-wrap{
    display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;padding:2px 18px 16px;margin:0 -18px;
    scrollbar-width:none;
  }
  .carousel-wrap::-webkit-scrollbar{display:none;}
  .carousel-wrap .condo-card{
    flex:0 0 86%;scroll-snap-align:center;margin-bottom:0;
  }
  .condo-card{
    background:var(--paper2);border:1.5px solid var(--line);border-radius:12px;
    padding:14px 15px 13px;margin-bottom:11px;border-left:5px solid var(--accent);
    position:relative;
  }
  .condo-card h3{margin:0 0 3px;font-size:16.5px;}
  .condo-meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:7px 0 9px;}
  .tag{
    font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;
    background:rgba(0,0,0,.06);color:var(--ink-soft);
  }
  .tag.hr24{background:rgba(63,125,92,.15);color:var(--green);}
  .tag-tipo{
    font-size:15px;font-weight:700;padding:6px 13px;border-radius:9px;
    letter-spacing:.1px;
  }
  .condo-line{font-size:14px;color:var(--ink-soft);line-height:1.55;}
  .condo-line b{color:var(--ink);font-weight:600;}
  .maps-link{
    color:var(--blue);text-decoration:none;font-weight:700;font-size:14px;
    display:inline-flex;align-items:center;gap:4px;
  }
  .maps-link:active{opacity:.7;}
  .maps-link svg{flex-shrink:0;}
  .maps-link:active{opacity:.7;}
  .card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .card-actions button{background:none;border:none;font-size:13.5px;font-weight:600;cursor:pointer;padding:2px 0;color:var(--ink-soft);text-align:left;}
  .card-actions button.edit{color:var(--blue);}
  .card-actions button.del{color:var(--red);}
  .card-actions button.pdf{color:var(--purple);}
  .card-actions button.share{color:var(--green);}
  .card-actions button.import{color:var(--accent-ink);}

  .toolbar-row{display:flex;gap:8px;margin-bottom:14px;}
  .toolbar-row .btn{width:auto;flex:1;padding:10px 10px;font-size:13px;}

  .import-hint{color:var(--ink-soft);font-size:14px;line-height:1.55;margin:0 0 16px;}
  textarea.code-input{
    width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
    font-size:13.5px;background:var(--paper2);color:var(--ink);font-family:ui-monospace,Menlo,monospace;resize:vertical;
  }

  .toast-wrap{
    position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;z-index:999;
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none;
  }
  .toast{
    background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;
    font-weight:600;max-width:420px;box-shadow:0 4px 16px rgba(0,0,0,.28);pointer-events:auto;text-align:center;
  }
  .toast.error{background:var(--red);}
  .toast.success{background:var(--green);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
    display:flex;align-items:center;justify-content:center;padding:22px;
  }
  .modal-box{background:var(--paper);border-radius:14px;padding:20px;max-width:420px;width:100%;}
  .modal-box h3{margin:0 0 10px;font-size:16.5px;}
  .modal-box p{margin:0 0 18px;font-size:14.5px;color:var(--ink-soft);line-height:1.55;}
  .modal-box textarea{
    width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;
    font-family:ui-monospace,Menlo,monospace;background:var(--paper2);color:var(--ink);margin-bottom:14px;
  }
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn{flex:1;width:auto;}

  .fab-bar{
    position:fixed;bottom:0;left:0;right:0;
    padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, var(--paper) 60%, transparent);
  }
  .fab-bar-inner{max-width:560px;margin:0 auto;}

  /* photo */
  .card-photo{
    width:100%;height:150px;object-fit:cover;border-radius:10px;
    margin-bottom:11px;cursor:pointer;display:block;border:1.5px solid var(--line);
  }
  .photo-field{margin-bottom:14px;}
  input.photo-file-input{
    width:100%;padding:12px 13px;border:1.5px dashed var(--line);border-radius:10px;
    background:var(--paper2);color:var(--ink);font-family:inherit;font-size:13.5px;cursor:pointer;
  }
  input.photo-file-input::file-selector-button{
    padding:8px 14px;border:none;border-radius:8px;background:var(--accent);color:var(--accent-ink);
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-right:10px;
  }
  .photo-preview-wrap{position:relative;margin-top:10px;}
  .photo-preview{width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);display:block;}
  .photo-remove{
    position:absolute;top:8px;right:8px;background:rgba(20,32,28,.72);color:#fff;
    border:none;border-radius:100px;width:30px;height:30px;font-size:16px;cursor:pointer;line-height:1;
  }

  /* address search */
  #condoSearchResults{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .search-result{
    padding:10px 12px;background:var(--paper2);border:1.5px solid var(--line);border-radius:9px;
    font-size:13.5px;cursor:pointer;line-height:1.4;
  }
  .search-result:active{background:rgba(217,164,65,.15);}
  .search-loading,.search-empty{font-size:13px;color:var(--ink-soft);margin-top:8px;}
  .search-attrib{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.4;}

  /* form */
  fieldset{border:none;padding:0;margin:0 0 20px;}
  legend{font-family:"Space Grotesk";font-size:14px;font-weight:600;color:var(--ink-soft);padding:0 0 10px;text-transform:none;}
  .radio-grid{display:flex;flex-direction:column;gap:8px;}
  .radio-opt{
    display:flex;align-items:center;gap:10px;padding:12px 13px;border:1.5px solid var(--line);
    border-radius:10px;cursor:pointer;background:var(--paper2);
  }
  .radio-opt input{width:auto;margin:0;}
  .radio-opt.checked{border-color:var(--accent);background:rgba(217,164,65,.12);}
  .radio-opt .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .checkbox-row{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:14.5px;font-weight:600;}
  .checkbox-row input{width:auto;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .form-actions .btn-ghost{flex:1;}
  .form-actions .btn-primary{flex:2;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var TIPOS = {
    portaria:{label:"Recebe na portaria", color:"var(--accent)"},
    adm:{label:"Recebe na ADM", color:"var(--blue)"},
    casa:{label:"Entrega casa a casa", color:"var(--purple)"},
    armario:{label:"Armário digital", color:"var(--green)"},
    port_digital:{label:"Portaria digital — chamar morador", color:"var(--red)"}
  };

  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ console.error("saveJSON falhou:", key, e); return false; }
  }

  var state = {
    view: "login", // login | signup | cities | list | form
    authError: "",
    session: loadJSON("cde_session", null),
    users: loadJSON("cde_users", []),
    condos: loadJSON("cde_condos", []),
    cities: loadJSON("cde_cities", []),
    currentCity: loadJSON("cde_lastCity", null),
    search: "",
    editingId: null
  };

  var formPhoto = null; // foto (dataURL) em edição no formulário, fora do state para não ser perdida em re-render

  if(state.session){ state.view = state.currentCity ? "list" : "cities"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function toast(msg, type){
    var wrap = document.getElementById("toastWrap");
    if(!wrap){
      wrap = document.createElement("div");
      wrap.id = "toastWrap";
      wrap.className = "toast-wrap";
      document.body.appendChild(wrap);
    }
    var el = document.createElement("div");
    el.className = "toast" + (type ? " " + type : "");
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function(){ el.remove(); }, 4500);
  }

  function showConfirmModal(message, onYes){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = ''
      + '<div class="modal-box">'
      + '  <p>'+esc(message)+'</p>'
      + '  <div class="modal-actions">'
      + '    <button type="button" class="btn btn-ghost" data-modal-cancel>Cancelar</button>'
      + '    <button type="button" class="btn btn-primary" data-modal-confirm>Confirmar</button>'
      + '  </div>'
      + '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector("[data-modal-cancel]").addEventListener("click", function(){ overlay.remove(); });
    overlay.querySelector("[data-modal-confirm]").addEventListener("click", function(){ overlay.remove(); onYes(); });
  }

  function showTextModal(title, text){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = ''
      + '<div class="modal-box">'
      + '  <h3>'+esc(title)+'</h3>'
      + '  <textarea rows="8" readonly>'+esc(text)+'</textarea>'
      + '  <div class="modal-actions">'
      + '    <button type="button" class="btn btn-ghost" data-modal-close>Fechar</button>'
      + '    <button type="button" class="btn btn-primary" data-modal-copy>Copiar</button>'
      + '  </div>'
      + '</div>';
    document.body.appendChild(overlay);
    var ta = overlay.querySelector("textarea");
    overlay.querySelector("[data-modal-close]").addEventListener("click", function(){ overlay.remove(); });
    overlay.querySelector("[data-modal-copy]").addEventListener("click", function(){
      ta.focus(); ta.select();
      var copied = false;
      try{ copied = document.execCommand("copy"); }catch(e){}
      if(copied){ toast("Copiado!", "success"); }
      else if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast("Copiado!", "success"); }).catch(function(){});
      }
    });
  }
  function mapsUrl(addr){
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr);
  }
  function uid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function compressImage(file, callback){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var maxW = 900;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl;
        try{ dataUrl = canvas.toDataURL("image/jpeg", 0.62); }
        catch(e){ callback(null); return; }
        callback(dataUrl);
      };
      img.onerror = function(){ callback(null); };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ callback(null); };
    reader.readAsDataURL(file);
  }

  function renderPhotoPreview(){
    var wrap = document.getElementById("photoPreviewWrap");
    if(!wrap) return;
    if(formPhoto){
      wrap.innerHTML = ''
        + '<div class="photo-preview-wrap">'
        + '  <img class="photo-preview" src="'+formPhoto+'" alt="Foto da fachada">'
        + '  <button type="button" class="photo-remove" id="btnRemovePhoto" aria-label="Remover foto">✕</button>'
        + '</div>';
      var btnRemovePhoto = document.getElementById("btnRemovePhoto");
      if(btnRemovePhoto){
        btnRemovePhoto.addEventListener("click", function(){
          formPhoto = null;
          var input = document.getElementById("condoPhotoInput");
          if(input) input.value = "";
          renderPhotoPreview();
        });
      }
    } else {
      wrap.innerHTML = "";
    }
  }

  function showPhotoModal(src){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = ''
      + '<div class="modal-box" style="padding:10px;">'
      + '  <img src="'+src+'" alt="Foto da fachada" style="width:100%;border-radius:10px;display:block;margin-bottom:12px;">'
      + '  <button type="button" class="btn btn-ghost" data-modal-close>Fechar</button>'
      + '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector("[data-modal-close]").addEventListener("click", function(){ overlay.remove(); });
    overlay.addEventListener("click", function(e){ if(e.target === overlay) overlay.remove(); });
  }

  var IMPORT_PREFIX = "CONDOSPX1:";

  function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64DecodeUtf8(str){ return decodeURIComponent(escape(atob(str))); }

  function buildCondoPayload(c){
    return {
      nome:c.nome, endereco:c.endereco, cidade:c.cidade, tipoEntrega:c.tipoEntrega,
      horarioSemana:c.horarioSemana||"", horarioSabado:c.horarioSabado||"", horarioFeriado:c.horarioFeriado||"",
      is24h: !!c.is24h,
      recebedorNome:c.recebedorNome||"", recebedorDocumento:c.recebedorDocumento||"", recebedorTelefone:c.recebedorTelefone||"",
      foto:c.foto||""
    };
  }
  function encodeImportCode(condo){
    return IMPORT_PREFIX + b64EncodeUtf8(JSON.stringify({type:"single", condo:condo}));
  }
  function encodeImportCodeMulti(condos){
    return IMPORT_PREFIX + b64EncodeUtf8(JSON.stringify({type:"multi", condos:condos}));
  }
  function decodeImportCode(str){
    str = String(str||"").trim();
    var idx = str.indexOf(IMPORT_PREFIX);
    if(idx === -1) throw new Error("formato inválido");
    var b64 = str.slice(idx + IMPORT_PREFIX.length).trim();
    return JSON.parse(b64DecodeUtf8(b64));
  }
  function slugify(s){
    return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase() || "arquivo";
  }

  function horarioResumo(c){
    if(c.is24h) return "24 horas";
    return "Seg-Sex: "+(c.horarioSemana||"não informado")+"  |  Sáb: "+(c.horarioSabado||"não informado")+"  |  Feriado: "+(c.horarioFeriado||"não informado");
  }

  function copyToClipboard(texto){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(function(){
        toast("Texto copiado! Cole no WhatsApp ou onde quiser enviar.", "success");
      }).catch(function(){ showTextModal("Copiar texto", texto); });
    } else {
      showTextModal("Copiar texto", texto);
    }
  }

  function shareCondoText(c){
    var code = encodeImportCode(buildCondoPayload(c));
    var tipo = (TIPOS[c.tipoEntrega] || {label:c.tipoEntrega}).label;
    var texto = "📦 " + c.nome + "\n"
      + "📍 Endereço: " + c.endereco + "\n"
      + "🔑 " + tipo + "\n"
      + "🕒 " + horarioResumo(c) + "\n"
      + "👤 Recebedor: " + (c.recebedorNome||"—") + (c.recebedorDocumento?" · "+c.recebedorDocumento:"") + (c.recebedorTelefone?" · "+c.recebedorTelefone:"") + "\n"
      + "🗺️ Mapa: " + mapsUrl(c.endereco) + "\n\n"
      + "Para adicionar automaticamente no Condo SPX, abra o app, toque em \"Importar\" e cole o código abaixo:\n"
      + code;

    if(navigator.share){

  function handleImport(){
    var input = document.getElementById("importInput");
    var payload;
    try{ payload = decodeImportCode(input.value); }
    catch(e){ toast("Código inválido. Confira se copiou o texto completo.", "error"); return; }

    var toAdd = [];
    if(payload.type === "single" && payload.condo) toAdd = [payload.condo];
    else if(payload.type === "multi" && Array.isArray(payload.condos)) toAdd = payload.condos;
    else { toast("Código inválido.", "error"); return; }

    toAdd.forEach(function(condo){
      var novo = Object.assign({}, condo, {
        id: uid(),
        criadoEm: Date.now(),
        cadastradoPor: state.session.displayName + " (importado)"
      });
      state.condos.push(novo);
      if(novo.cidade){
        var existsCity = state.cities.some(function(ct){ return ct.toLowerCase() === novo.cidade.toLowerCase(); });
        if(!existsCity) state.cities.push(novo.cidade);
      }
    });
    saveJSON("cde_condos", state.condos);
    saveJSON("cde_cities", state.cities);
    toast(toAdd.length + " condomínio(s) importado(s) com sucesso.", "success");
    state.view = "cities";
    render();
  }

    else if(state.view === "list") html = renderList();
    else if(state.view === "form") html = renderForm();
    else if(state.view === "import") html = renderImport();
    root.innerHTML = html;
    bindEvents();
  }

  function handleAuthSubmit(e){
    e.preventDefault();
    var f = e.target;
    var username = f.username.value.trim();
    var password = f.password.value;
    if(!username || !password){ return; }
    var uname = username.toLowerCase();

    if(state.view === "signup"){
      var password2 = f.password2.value;
      if(password !== password2){
        state.authError = "As senhas não são iguais.";
        return render();
      }
      if(password.length < 4){
        state.authError = "Use uma senha com pelo menos 4 caracteres.";
        return render();
      }
      var exists = state.users.some(function(u){ return u.username === uname; });
      if(exists){
        state.authError = "Esse usuário já existe. Faça login.";
        return render();
      }
      state.users.push({ username: uname, displayName: username, password: password, criadoEm: Date.now() });
      saveJSON("cde_users", state.users);
      state.session = { username: uname, displayName: username };
      saveJSON("cde_session", state.session);
      state.authError = "";
      state.view = "cities";
      if(window.gtag) gtag('event', 'sign_up');
      return render();
    }

    // login
    var user = state.users.find(function(u){ return u.username === uname; });
    if(!user || user.password !== password){
      state.authError = "Usuário ou senha incorretos.";
      return render();
    }
    state.session = { username: user.username, displayName: user.displayName };
    saveJSON("cde_session", state.session);
    state.authError = "";
    state.view = state.currentCity ? "list" : "cities";
    render();
  }

  var addressSearchTimer = null;
  var addressSearchResults = [];

  function searchAddress(query){
    var resultsWrap = document.getElementById("condoSearchResults");
    if(!resultsWrap) return;
    resultsWrap.innerHTML = '<div class="search-loading">Buscando...</div>';
    var q = query + (state.currentCity ? ", " + state.currentCity : "") + ", Brasil";
    var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&namedetails=1&limit=5&countrycodes=br&accept-language=pt-BR&q=" + encodeURIComponent(q);
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        var wrap = document.getElementById("condoSearchResults");
        if(!wrap) return;
        addressSearchResults = Array.isArray(data) ? data : [];
        if(!addressSearchResults.length){
          wrap.innerHTML = '<div class="search-empty">Nada encontrado. Preencha manualmente abaixo.</div>';
          return;
        }
        wrap.innerHTML = addressSearchResults.map(function(item, i){
          return '<div class="search-result" data-idx="'+i+'">'+esc(item.display_name)+'</div>';
        }).join('');
        wrap.querySelectorAll(".search-result").forEach(function(el){
          el.addEventListener("click", function(){
            applyAddressResult(addressSearchResults[Number(el.getAttribute("data-idx"))]);
          });
        });
      })
      .catch(function(){
        var wrap = document.getElementById("condoSearchResults");
        if(wrap) wrap.innerHTML = '<div class="search-empty">Busca indisponível agora. Preencha manualmente.</div>';
      });
  }

  function formatEnderecoFromAddress(addr, fallback){
    if(!addr) return fallback;
    var rua = addr.road || addr.pedestrian || addr.residential || "";
    var numero = addr.house_number || "";
    var bairro = addr.suburb || addr.neighbourhood || addr.quarter || "";
    var linha1 = rua ? (rua + (numero ? ", " + numero : "")) : "";
    var partes = [linha1, bairro].filter(function(p){ return p; });
    return partes.length ? partes.join(", ") : fallback;
  }

  function applyAddressResult(item){
    if(!item) return;
    var form = document.getElementById("condoForm");
    if(!form) return;
    var nomeInput = form.querySelector('input[name="nome"]');
    var enderecoInput = form.querySelector('input[name="endereco"]');
    var addr = item.address || {};
    var nomeGuess = (item.namedetails && item.namedetails.name) || addr.building || "";
    if(nomeInput && !nomeInput.value.trim() && nomeGuess) nomeInput.value = nomeGuess;
    if(enderecoInput) enderecoInput.value = formatEnderecoFromAddress(addr, item.display_name);
    var wrap = document.getElementById("condoSearchResults");
    if(wrap) wrap.innerHTML = "";
    var searchInput = document.getElementById("condoSearchInput");
    if(searchInput) searchInput.value = "";
    toast("Endereço preenchido. Confira os dados abaixo.", "success");
  }

  function handleCondoSubmit(e){
    e.preventDefault();
    var f = e.target;
    var is24h = f.is24h.checked;
    var data = {
      nome: f.nome.value.trim(),
      endereco: f.endereco.value.trim(),
      cidade: state.currentCity,
      tipoEntrega: f.tipoEntrega.value,
      horarioSemana: is24h ? "" : f.horarioSemana.value.trim(),
      horarioSabado: is24h ? "" : f.horarioSabado.value.trim(),
      horarioFeriado: is24h ? "" : f.horarioFeriado.value.trim(),
      is24h: is24h,
      recebedorNome: f.recebedorNome.value.trim(),
      recebedorDocumento: f.recebedorDocumento.value.trim(),
      recebedorTelefone: f.recebedorTelefone.value.trim(),
      cadastradoPor: state.session.displayName,
      foto: formPhoto || ""
    };
    if(!data.nome || !data.endereco) return;

    var newCondos;
    if(state.editingId){
      newCondos = state.condos.map(function(c){
        return c.id === state.editingId ? Object.assign({}, c, data) : c;
      });
    } else {
      data.id = uid();
      data.criadoEm = Date.now();
      newCondos = state.condos.concat([data]);
    }

    var ok = saveJSON("cde_condos", newCondos);
    if(!ok){
      toast("Não foi possível salvar: o armazenamento do navegador está cheio. Tente uma foto menor ou remova fotos antigas de outros condomínios.", "error");
      return;
    }
    state.condos = newCondos;
    state.editingId = null;
    formPhoto = null;
    state.view = "list";
    render();
  }

  // ---------- EVENTS ----------
  function bindEvents(){
    var authForm = document.getElementById("authForm");
    if(authForm) authForm.addEventListener("submit", handleAuthSubmit);

    var toSignup = document.getElementById("toSignup");
    if(toSignup) toSignup.addEventListener("click", function(){ state.view="signup"; state.authError=""; render(); });
    var toLogin = document.getElementById("toLogin");
    if(toLogin) toLogin.addEventListener("click", function(){ state.view="login"; state.authError=""; render(); });

    var btnLogout = document.getElementById("btnLogout");
    if(btnLogout) btnLogout.addEventListener("click", logout);

    var btnAddCity = document.getElementById("btnAddCity");
    if(btnAddCity) btnAddCity.addEventListener("click", addCity);
    var newCityInput = document.getElementById("newCityInput");
    if(newCityInput) newCityInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addCity(); } });

    document.querySelectorAll(".city-item").forEach(function(el){
      el.addEventListener("click", function(){ selectCity(el.getAttribute("data-city")); });
    });

    var btnBackCities = document.getElementById("btnBackCities");
    if(btnBackCities) btnBackCities.addEventListener("click", function(){ state.view="cities"; render(); });

    var searchInput = document.getElementById("searchInput");
    if(searchInput){
      searchInput.addEventListener("input", function(){
        state.search = searchInput.value;
        var pos = searchInput.selectionStart;
        render();
        var again = document.getElementById("searchInput");
        if(again){ again.focus(); again.setSelectionRange(pos,pos); }
      });
    }

    var btnNewCondo = document.getElementById("btnNewCondo");
    if(btnNewCondo) btnNewCondo.addEventListener("click", function(){ state.editingId=null; formPhoto=null; state.view="form"; render(); });

    document.querySelectorAll("[data-edit]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-edit");
        var c = state.condos.find(function(x){ return x.id === id; });
        state.editingId = id;
        formPhoto = (c && c.foto) ? c.foto : null;
        state.view="form"; render();
      });
    });
    document.querySelectorAll("[data-del]").forEach(function(el){
      el.addEventListener("click", function(){ deleteCondo(el.getAttribute("data-del")); });
    });
    document.querySelectorAll("[data-share]").forEach(function(el){
      el.addEventListener("click", function(){
        var c = state.condos.find(function(x){ return x.id === el.getAttribute("data-share"); });
        if(c) shareCondoText(c);
      });
    });
    document.querySelectorAll("[data-photo]").forEach(function(el){
      el.addEventListener("click", function(){
        var c = state.condos.find(function(x){ return x.id === el.getAttribute("data-photo"); });
        if(c && c.foto) showPhotoModal(c.foto);
      });
    });
    document.querySelectorAll("[data-goimport]").forEach(function(el){
      el.addEventListener("click", function(){ state.view="import"; render(); });
    });

    var btnGoImportCities = document.getElementById("btnGoImportCities");
    if(btnGoImportCities) btnGoImportCities.addEventListener("click", function(){ state.view="import"; render(); });
    var btnCancelImport = document.getElementById("btnCancelImport");
    if(btnCancelImport) btnCancelImport.addEventListener("click", function(){ state.view = state.currentCity ? "list" : "cities"; render(); });
    var btnDoImport = document.getElementById("btnDoImport");
    if(btnDoImport) btnDoImport.addEventListener("click", handleImport);

    var condoSearchInput = document.getElementById("condoSearchInput");
    if(condoSearchInput){
      condoSearchInput.addEventListener("input", function(){
        var q = condoSearchInput.value.trim();
        clearTimeout(addressSearchTimer);
        var wrap = document.getElementById("condoSearchResults");
        if(q.length < 3){ if(wrap) wrap.innerHTML = ""; return; }
        addressSearchTimer = setTimeout(function(){ searchAddress(q); }, 600);
      });
    }

    var condoForm = document.getElementById("condoForm");
    if(condoForm){
      condoForm.addEventListener("submit", handleCondoSubmit);

      renderPhotoPreview();
      var condoPhotoInput = document.getElementById("condoPhotoInput");
      if(condoPhotoInput){
        condoPhotoInput.addEventListener("change", function(){
          var file = condoPhotoInput.files && condoPhotoInput.files[0];
          if(!file) return;
          if(!file.type || file.type.indexOf("image/") !== 0){
            toast("Selecione um arquivo de imagem.", "error");
            condoPhotoInput.value = "";
            return;
          }
          toast("Processando foto...");
          compressImage(file, function(dataUrl){
            if(!dataUrl){ toast("Não foi possível processar a foto.", "error"); return; }
            formPhoto = dataUrl;
            renderPhotoPreview();
          });
        });
      }

      var is24h = document.getElementById("is24h");
      var horarioSemanaInput = condoForm.querySelector('input[name="horarioSemana"]');
      var horarioSabadoInput = condoForm.querySelector('input[name="horarioSabado"]');
      var horarioFeriadoInput = condoForm.querySelector('input[name="horarioFeriado"]');
      if(is24h && horarioSemanaInput && horarioSabadoInput && horarioFeriadoInput){
        is24h.addEventListener("change", function(){
          horarioSemanaInput.disabled = is24h.checked;
          horarioSabadoInput.disabled = is24h.checked;
          horarioFeriadoInput.disabled = is24h.checked;
          if(is24h.checked){ horarioSemanaInput.value=""; horarioSabadoInput.value=""; horarioFeriadoInput.value=""; }
        });
      }
      condoForm.querySelectorAll('input[name="tipoEntrega"]').forEach(function(r){
        r.addEventListener("change", function(){
          condoForm.querySelectorAll(".radio-opt").forEach(function(o){ o.classList.remove("checked"); });
          r.closest(".radio-opt").classList.add("checked");
        });
      });
    }

    var btnCancelForm = document.getElementById("btnCancelForm");
    if(btnCancelForm) btnCancelForm.addEventListener("click", function(){ state.editingId=null; formPhoto=null; state.view="list"; render(); });
    var btnCancelForm2 = document.getElementById("btnCancelForm2");
    if(btnCancelForm2) btnCancelForm2.addEventListener("click", function(){ state.editingId=null; formPhoto=null; state.view="list"; render(); });
  }

  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* instalação segue funcionando sem cache offline */ });
    });
  }
})();
</script>
</body>
</html>
